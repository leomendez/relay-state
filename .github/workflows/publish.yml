name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - run: vp check
      - run: vp test
      - run: vp run build

      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org

      - run: npm publish --provenance --access public
